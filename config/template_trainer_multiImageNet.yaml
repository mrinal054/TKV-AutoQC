model:
  name: MultiImageNet
  subname: null  # Optional alias, can leave as 'base' or null
  suffix: DenseNet121_cosine_reg_v3 # !!! MUST provide a unique suffix to prevent overwriting. Will also be used to resume training.
  in_channels: 1
  out_channels: null
  dropout: 0.25
  pretrained_path: null 
  freeze_backbone: False # required for multiImageNet
  unfreeze_epoch: null 
  
  # MultiImageNet-specific parameters:
  dummy_size: [1,1,64,128,128]
  config_path: networks/config_multiImageNet.yaml
  
train:
  epochs: 300 
  backbone_lr: 0.00015
  classifier_lr: 0.00015
  optimizer: adam
  scheduler:
    type: cosine_warmup # available: cosine_warmup, cosine_warmup_v2 (does not have base lr), default: ReduceLROnPlateau
    warmup_epochs: 25
    min_lr: 1e-6
  weight_decay: 0.001
  save_weights_only: True
  save_best_model: True 
  save_last_model: True
  one_hot: False
  period: 20
  early_stop: False
  patience: 25
  batch_size: 8                 
  n_classes: 3
  kfold: 5
  kfold_seed: 42 # random seed used to generate k-fold
  run_folds: [0] # null # a list (e.g. [0,1]) or null. null means run all folds
  retrain: 
    resume_train: False
    resume_folds: [0] # must be a list 
  device: cuda

test:
  base_model_name: null  
  type: average  
  output_subdir: results_test # Use a different value for validation and final test inference so results are not overwritten.

phase: train # either train, test, or both

classification_type: multiclass # either binary, multiclass or multilabel

directories:
  root: /path/to/repo
  excel_train_dir: /path/to/train_set_file.xlsx
  excel_test_dir: /path/to/test_set_file.xlsx
  result_dir: /path/to/results_dir
  
data:
  dataloader: loaderv5 # which loader to use as dataloader.
  label_column: Labels # ['Accept', 'Reject', 'Rework'] # column names of labels 
  
  # Three MultiImageNet inputs:
  # 0 = full scan, 1 = segmentation mask, 2 = masked scan
  dir_column: [Directories_1, Seg_dirs, Directories_2] # name of the column in the dataframe that lists image directories (full path). 
  binary_mask: [null, null, [1,2]] # these labels will be used to generate ROI
  mask_column: [null, null, Seg_dirs] # these columns have directories to mask 
  
  # Mask-aware processing for the second input
  input_types: ["image", "mask", "image"]
  preserve_mask_labels: True
  mask_input_modes: [null, "binary", null]
  mask_keep_values: [null, [1, 2], null]
  
  use_sampler: True # If true it will do a per-epoch balanced sampling
  resample: [5.0, null, null] 
  n_zSlices: 82
  zSlices_pad_value: 0
  clip: null
  clip_percentile: [0.5, 99]
  normalize: True
  resize: [64, 128, 128] # DHW
  resize_method: 'interpolation'
  resize_pad_value: 0
  n_workers: 8

transform:
  do_transform: True 
  transform_mode: shared_spatial 
  
  transform_keys: ["transform1", "transform1", "transform1"]
  shared_transform_key: transform1
  
  # input 0 = Directories_1
  # input 1 = Seg_dirs
  # input 2 = Directories_2
  input_types: ["image", "mask", "image"]
  
  # Apply intensity transforms only to non-mask inputs.
  intensity_apply_to: images

  # Synchronize intensity augmentation across image inputs only.
  intensity_sync_across_inputs: True

  # Keep mask interpolation label-preserving for spatial transforms.
  mask_interpolation: nearest
  force_mask_nearest: True

  # Your chosen lateral flip axis after MONAI channel-first correction:
  # C x D x H x W, so spatial_axis 2 = W/X = lateral axis in your assumed coronal view.
  left_right_spatial_axis: 2

  # Leave null if you do not want 1 <-> 2 relabeling after lateral flip.
  label_swap_after_flip: null
    #1:
      #1: 2
      #2: 1
  
  transform1:
      RandFlip:
        spatial_axis: 2 # For C,D,H,W tensors, spatial axis 2 is W/X (lateral)
        prob: 0.5
      RandRotate:
        range_x: 0.25
        range_y: 0.25
        range_z: 0.25
        keep_size: True
        mode: bilinear # nearest
        prob: 0.5
      RandScaleIntensity:
        factors: [0.95, 1.05]
        prob: 0.5
      RandGaussianNoise:
        mean: 0.0
        std: 0.02
        prob: 0.5
      RandBiasField:
        coeff_range: [0.1, 0.3]
        prob: 0.5
      RandGaussianSmooth:
        sigma_x: [0.3, 0.3]
        sigma_y: [0.3, 0.3]
        sigma_z: [0.3, 0.3]
        prob: 0.5
        
  transform2: null
          
metric:
  metric_mode: weighted

loss:
  name: ce
  weights: null
